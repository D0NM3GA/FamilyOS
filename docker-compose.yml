services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: familycrm
      # Only applies on a fresh volume (first `db:up`, or after `db:down -v`) — the
      # postgres image ignores these once data/ already exists. See .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familycrm}
      POSTGRES_DB: familycrm_dev
    ports:
      # Loopback-only — this file is dev-only with default credentials; never publish
      # this port on a publicly-reachable host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familycrm -d familycrm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
