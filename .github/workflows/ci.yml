# Phase 41: every pull request and every push to main (README "Testing").
#
# Supply chain, as for npm packages: actions are pinned to full commit SHAs (a tag can be moved),
# each at least 7 days old when pinned; checkout keeps no token; the jobs can only read the repo.
# Nothing here has a real secret: each run makes its own keys, and Microsoft, an OIDC provider,
# Sentry, email and phone push stay off. The one optional secret, PRIVACY_TERMS, reaches only the
# privacy step.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    name: Lint, types, privacy, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Read by prisma generate (npm ci) and at import by the unit tests; nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/unused
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # privacy:check checks the commits this branch adds, from its merge base with
          # origin/main (on a push to main there are none).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Keys for this run
        run: |
          secret="$(openssl rand -base64 32)"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "::add-mask::$key"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Privacy check
        # Without the secret it still checks for hidden characters. CI=true keeps the terms out
        # of the log (scripts/check-privacy.mjs).
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: npm run privacy:check
      - run: npm test

  database:
    name: Migrations and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Pinned like everything else: the exact build (2026-10-06), not a moving tag.
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: familycrm
          POSTGRES_PASSWORD: familycrm
          POSTGRES_DB: familycrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familycrm -d familycrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://familycrm:familycrm@localhost:5432/familycrm_ci
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Keys for this run
        run: |
          secret="$(openssl rand -base64 32)"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "::add-mask::$key"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: npx prisma migrate deploy
      - name: Migrations match the schema
        # Exit code 2 means the migrated database and prisma/schema.prisma differ: a schema
        # change without its migration (or the other way round).
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:db

  e2e:
    name: Build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Pinned like everything else: the exact build (2026-10-06), not a moving tag.
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: familycrm
          POSTGRES_PASSWORD: familycrm
          POSTGRES_DB: familycrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familycrm -d familycrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # e2e/serve.mjs drops and makes this one; DATABASE_URL is only there for its "not the
      # same database" check and prisma generate.
      E2E_DATABASE_URL: postgresql://familycrm:familycrm@localhost:5432/familycrm_e2e
      DATABASE_URL: postgresql://familycrm:familycrm@localhost:5432/familycrm_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Keys for this run
        run: |
          secret="$(openssl rand -base64 32)"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "::add-mask::$key"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser (from the cache when it's there) and the system libraries it needs.
      - run: npx playwright install --with-deps --no-shell chromium
      # Builds, starts on a fresh database, runs the tests (playwright.config.ts, e2e/serve.mjs).
      - run: npm run test:e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
