# Phase 43: the production image (Dockerfile, docker-compose.prod.yml), built and tested on a
# fresh database by scripts/container-test.sh: the run image is checked (nothing secret, no
# development tools, not root) and the browser tests run against it.
#
# It's a required check, so it reports on every pull request, but a cold image build takes
# minutes: the first step looks at what the pull request changes, and only a change to what goes
# into the image (the list in `Which files changed`) builds and tests it. Anything else passes in
# seconds; the CI workflow's browser tests still run everywhere. On main it always runs in full.
#
# Phase 46: on main, the images it built and tested are then published to GitHub's container
# registry by a separate job (`publish`), the only one that can write there: it loads the saved
# images, pushes them as `sha-<commit>`, attests where they came from, and moves `main` only if
# its commit is still the branch's head. It runs no npm install and no project code.
#
# Same supply-chain rules as ci.yml: actions pinned to full commit SHAs, no token kept, read-only.
# No docker/* actions: `docker compose` is already on the runner. Each run makes its own keys.
name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull request runs replace each other; main runs queue, so every merge gets its image.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Local names for the images under test; the publish job gives them their registry names.
  FAMILYOS_IMAGE: familyos-ci
  FAMILYOS_VERSION: local
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"
  DO_NOT_TRACK: "1"

jobs:
  container:
    name: Production image and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out as a merge commit: its first parent is the base branch, so
          # one more commit is enough to see what the pull request changes.
          fetch-depth: 2
      - name: Which files changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What goes into the image, or into the tests run against it.
          image='^(Dockerfile|\.dockerignore|docker-compose\.(prod|ci)\.yml|scripts/container-test\.sh|scripts/break-glass[^/]*\.sh|deploy/|proxy\.ts|lib/security/|scripts/standalone-assets\.mjs|scripts/copy-zxing-wasm\.mjs|e2e/|tsconfig\.json|next\.config\.ts|package(-lock)?\.json|\.node-version|\.npmrc|prisma/|\.github/workflows/container\.yml)'
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$changed" | grep -Eq "$image"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Builds the image: this pull request changes $(printf '%s\n' "$changed" | grep -E "$image" | tr '\n' ' ')"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that goes into the image changed: passing without building it."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.build == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      # Playwright and its browser run on the runner; the app runs in the image.
      - run: npm ci
        if: steps.changes.outputs.build == 'true'
      - name: Playwright version
        if: steps.changes.outputs.build == 'true'
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.build == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --no-shell chromium
        if: steps.changes.outputs.build == 'true'
      - name: Build the image and run the browser tests against it
        if: steps.changes.outputs.build == 'true'
        env:
          CONTAINER_LOG: container-app.log
        run: scripts/container-test.sh
      # Phase 42.7: the Cloudflare Access check and the break-glass entrance, on the same image.
      - name: Rehearse the break-glass entrance
        if: steps.changes.outputs.build == 'true'
        run: scripts/break-glass-test.sh
      # Phase 46: the exact images that just passed, for the publish job (main only).
      - name: Save the tested images
        if: github.event_name == 'push' && steps.changes.outputs.build == 'true'
        run: docker save familyos-ci:local familyos-ci-migrate:local | gzip -1 > tested-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && steps.changes.outputs.build == 'true'
        with:
          name: tested-images
          path: tested-images.tar.gz
          retention-days: 1
          # Already compressed.
          compression-level: 0
      - name: Keep the report and the app's log when something failed
        if: failure() && steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-report
          path: |
            playwright-report/
            test-results/
            container-app.log
          retention-days: 7

  publish:
    name: Publish the tested images
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that can write to the registry. No checkout, no npm, no project code.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
      - name: Push the tested images as sha-<commit>
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Registry names must be lowercase; the account name may not be.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          app="ghcr.io/$owner/familyos"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          gunzip -c tested-images.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # push <local image> <registry name> <output name>: pushes sha-<commit>, records its digest.
          push() {
            docker tag "$1" "$2:sha-$GITHUB_SHA"
            docker push "$2:sha-$GITHUB_SHA"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$2:sha-$GITHUB_SHA")"
            echo "$3=${digest##*@}" >> "$GITHUB_OUTPUT"
          }
          push familyos-ci:local "$app" app_digest
          push familyos-ci-migrate:local "$app-migrate" migrate_digest
      # Where each image came from (this workflow, this commit), signed and kept in the registry
      # beside it: `gh attestation verify oci://… --owner <owner>` (README "Start, update, roll back").
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.app }}
          subject-digest: ${{ steps.push.outputs.app_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.app }}-migrate
          subject-digest: ${{ steps.push.outputs.migrate_digest }}
          push-to-registry: true
      - name: Move main to these images, if this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.push.outputs.app }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head: leaving the main tag to its run."
            exit 0
          fi
          for image in "$APP" "$APP-migrate"; do
            docker tag "$image:sha-$GITHUB_SHA" "$image:main"
            docker push "$image:main"
          done
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io
